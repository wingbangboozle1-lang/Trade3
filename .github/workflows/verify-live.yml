# Continuous, machine-run verification of every published table row.
#
# The site's rule is: a row exists only if the official API returned it. That rule is not
# asserted in prose here — it is executed. GitHub runners have ordinary outbound HTTPS, so
# this workflow can do what the build sandbox could not (see docs/flagged.html#F12): re-read
# GET /series/{ticker} for all 39 published rows and diff every field the site prints.
#
# It never blocks a publish (continue-on-error). Drift is reported as a warning + job summary,
# which is the board's "needs review" state: it goes to the Flagged page, not to a red X.

name: Re-verify published rows against the live API

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours, offset to avoid the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/data/series.json'
      - 'scripts/verify_series.py'

permissions:
  contents: read

concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  verify:
    name: Row-by-row re-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exchange status (demo)
        run: |
          curl -s --max-time 20 https://external-api.demo.kalshi.co/trade-api/v2/exchange/status \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('exchange_active:', d.get('exchange_active'), '| trading_active:', d.get('trading_active'), '| shards:', [s.get('exchange_index') for s in d.get('exchange_index_statuses', [])])"

      - name: Verify every published series row
        id: rows
        continue-on-error: true
        run: |
          python scripts/verify_series.py --json verification-report.json | tee verification.txt
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Row-by-row verification against the live demo API"
            echo
            echo '```'
            cat verification.txt
            echo '```'
            echo
            if [ "$status" -eq 0 ]; then
              echo "**All published rows match their official API records.**"
            else
              echo "::warning title=Published rows drifted from the API::Some rows no longer match GET /series/{ticker}. Update the row from the API record (never from memory) or move it to the Flagged page."
              echo "**Drift detected — the affected rows must be corrected or flagged.**"
            fi
            echo
            echo "Verified by: \`scripts/verify_series.py\` against \`https://external-api.demo.kalshi.co/trade-api/v2\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Verify the topic discovery queries still answer as documented
        run: |
          for q in "series?category=Gas" "series?category=Golf" "series?category=Culture" "series?category=Crypto" "series?category=Elections" "series?category=Sports&tags=Golf"; do
            body=$(curl -s --max-time 25 "https://external-api.demo.kalshi.co/trade-api/v2/$q")
            n=$(printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('series'); print(0 if not s else len(s))" 2>/dev/null || echo "ERR")
            echo "$q -> $n series"
            echo "| \`GET /$q\` | $n series |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            verification-report.json
            verification.txt
          if-no-files-found: ignore
