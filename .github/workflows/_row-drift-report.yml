# TEMPORARY diagnostic: prints the row-by-row drift that verify-live only summarises.
# Deleted once the findings are recorded in COORDINATION.md.

name: Row drift report (temporary)

on:
  push:
    branches: [arena/651b296e-trade3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the verifier and print every diff
        run: python scripts/verify_series.py 2>&1 | tail -80

      - name: Published site is live?
        run: |
          echo "=== root ==="
          curl -sS -o /tmp/r.html -w 'GET / -> %{http_code} %{size_download}B\n' --max-time 30 https://wingbangboozle1-lang.github.io/Trade3/
          grep -oi '<title>[^<]*' /tmp/r.html | head -1
          echo "=== every published page ==="
          fails=0
          while IFS= read -r f; do
            rel=${f#docs/}
            code=$(curl -sS -o /tmp/p.html -w '%{http_code}' --max-time 25 "https://wingbangboozle1-lang.github.io/Trade3/$rel")
            served=$(wc -c < /tmp/p.html); local_b=$(wc -c < "$f")
            if [ "$code" != "200" ]; then echo "MISSING $rel ($code)"; fails=$((fails+1));
            elif [ "$served" != "$local_b" ]; then echo "STALE   $rel (docs=$local_b served=$served)"; fails=$((fails+1));
            else echo "OK      $rel"; fi
          done < <(find docs -name '*.html' | sort)
          echo "failures: $fails"
          test "$fails" = "0"
