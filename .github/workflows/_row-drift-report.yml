{
  "name": "Row drift report (temporary)",
  "on": {
    "push": {
      "branches": [
        "arena/651b296e-trade3"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "report": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Run the verifier and surface every diff as an annotation",
          "run": "set +e\npython scripts/verify_series.py > drift.txt 2>&1\nstatus=$?\necho \"verify_series exit=$status\"\ncat drift.txt\n{\n  echo '## verify_series.py result'\n  echo\n  echo \"exit code: **$status**\"\n  echo\n  echo '```'\n  cat drift.txt\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\n# Annotations survive even when the raw log is not downloadable.\nif [ \"$status\" -ne 0 ]; then\n  echo \"::error title=DRIFT (exit $status)::$(grep -vE '^\\s*$' drift.txt | head -25 | tr '\\n' '|' | cut -c1-900)\"\n  grep -iE 'mismatch|drift|FAIL|diff|changed' drift.txt | head -12 | while IFS= read -r line; do\n    echo \"::error::$line\"\n  done\nelse\n  echo \"::notice title=Rows clean::verify_series.py exited 0 - every published row matches GET /series/{ticker}\"\nfi\nexit $status"
        }
      ]
    }
  }
}
