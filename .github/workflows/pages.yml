# Publishes the static site in /docs to GitHub Pages.
#
# Notes for reviewers:
#  - The site is plain HTML/CSS/ES modules, so this workflow only uploads /docs.
#  - It runs the link checker and the render harness first; a broken site never deploys.
#  - If this workflow cannot run in your repo (Actions disabled, or Pages not enabled),
#    the alternative is Settings → Pages → Source: "Deploy from a branch" → main /docs.
#    The /docs folder is already complete and requires no build step.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link check
        run: node scripts/check-links.js
      - name: Render harness
        run: node tests/site-render-test.js
      - name: Unit and route tests
        run: node tests/smoke-test.js

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
