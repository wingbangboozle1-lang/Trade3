# Publishes the static site in /docs to GitHub Pages.
#
# The site is plain HTML/CSS/ES modules with no build step. This workflow verifies
# it, then publishes it. A site that fails a check never deploys.
#
# HOW IT PUBLISHES: by pushing the `docs/` tree to the `gh-pages` branch, which is
# the source GitHub Pages is bound to on this repository (verified 2026-11-21:
# GET /repos/{owner}/{repo}/pages -> status "built", build_type "legacy",
# source { branch: "gh-pages", path: "/" }). The Pages API routes
# (POST /pages, actions/configure-pages with enablement) return 403
# "Resource not accessible by integration" for this installation, so they are no
# longer used. Pushing needs only `contents: write`; because a GITHUB_TOKEN push does
# not wake a legacy Pages build, the push is followed by an explicit
# POST /repos/{owner}/{repo}/pages/builds request, and the job fails loudly if the
# published tree does not converge to docs/ at the pushed commit.
#
# Manual alternative: Actions -> "Deploy site to GitHub Pages" -> Run workflow.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static site gate (links, JS syntax, data integrity)
        run: python scripts/check_site.py

      - name: Link check (both published builds)
        run: node scripts/check-links.js

      - name: Dashboard logic tests
        run: node tests/logic.test.mjs

      - name: WebSocket + relay conformance tests (RFC 6455 vectors, Kalshi feed client)
        run: node tests/ws.test.mjs && node tests/relay.test.mjs

      - name: Collector and engine tests
        run: |
          # Watchdog: a hang must fail fast and name itself. The smoke harness
          # streams START/PASS lines and prints the active handle at 45s, and the
          # tail is embedded in an ::error annotation (annotations survive even
          # when the log receiver is down). set +e first: the Actions shell runs
          # with -e, which would otherwise abort before the report runs.
          set +e
          timeout 300 node tests/smoke-test.js > /tmp/smoke.out 2>&1
          code=$?
          set -e
          cat /tmp/smoke.out
          if [ "$code" != "0" ]; then
            echo "::error title=Collector and engine tests failed or hung (exit ${code})::$(grep -v '^START' /tmp/smoke.out | tail -8 | tr '\n' '|' | tail -c 700)"
            exit "$code"
          fi

      - name: Render tests (headless DOM)
        run: |
          npm install --no-save --no-fund --silent jsdom@25
          node tests/render.test.mjs
          node tests/site-render-test.js

      # The Python simulation layer is dependency-free apart from `requests`; these are the
      # offline unit checks the deleted ci.yml used to run, folded in so one workflow gates a publish.
      - name: Python layer — syntax and offline unit checks
        run: |
          python -m py_compile kalshi_client.py strategies.py backtest.py run_sim.py scripts/verify_series.py scripts/check_site.py
          pip install --quiet requests cryptography
          python - <<'PY'
          from strategies import momentum, mean_reversion, favorite_longshot, is_high_roi
          from backtest import PaperPortfolio, median_dollar_vol
          from kalshi_client import KalshiClient, dollar_volume, TOPIC_FILTERS

          m = {"ticker": "T", "last_price_dollars": "0.5500", "yes_bid_dollars": "0.5400",
               "yes_ask_dollars": "0.5600", "volume_fp": "1000.00"}

          # strategy signals
          assert momentum(m, 0.45) == "yes" and momentum(m, 0.65) == "no" and momentum(m, 0.50) is None
          # the exact-cent comparison, which float subtraction would break: 0.42 - 0.32 = 0.09999...
          assert (0.42 - 0.32) != 0.10, "sanity: floats really do drift here (0.09999999999999998)"
          assert momentum({"ticker": "X", "last_price_dollars": "0.4200"}, 0.32) == "yes", \
              "an exactly-$0.10 move must not be lost to float noise"
          assert mean_reversion({**m, "last_price_dollars": "0.1200"}) == "yes"
          assert mean_reversion({**m, "last_price_dollars": "0.9000"}) == "no"
          assert favorite_longshot({**m, "last_price_dollars": "0.7000"}) == "yes"
          assert is_high_roi(m, 0.45, 100.0) is True and is_high_roi(m, 0.54, 100.0) is False

          # dollars traded = volume_fp x last price (the disclosed approximation)
          assert dollar_volume(m) == 550.0
          three = [m, {**m, "ticker": "B", "volume_fp": "2000.00"}, {**m, "ticker": "C", "volume_fp": "500.00"}]
          assert median_dollar_vol(three) == 550.0

          # paper ledger: a YES buy pays the ask, a NO buy pays 1 - best YES bid, settlement pays $1
          pf = PaperPortfolio()
          t = pf.open_position(m, "momentum", "yes", 10, 1)
          assert abs(t.entry_price - 0.56) < 1e-9, t.entry_price
          pf.settle({"ticker": "T", "result": "yes"})
          got = pf.summary()
          assert got["settled_trades"] == 1 and got["total_pnl"] == 4.4 and abs(got["cash"] - 1004.4) < 1e-9, got
          pf2 = PaperPortfolio()
          t2 = pf2.open_position(m, "mean_reversion", "no", 10, 1)
          assert abs(t2.entry_price - 0.46) < 1e-9, t2.entry_price

          # order contract + safety: the V2 body shape, and nothing is sent without the env opt-in
          res = KalshiClient().place_order("T", "bid", 1, 0.42, dry_run=False)
          assert res.get("dry_run") is True, "dry_run=False must STILL not send without KALSHI_ALLOW_ORDERS=1"
          body = res["request"]
          assert body == {"ticker": "T", "side": "bid", "count": "1.00", "price": "0.4200",
                          "time_in_force": "good_till_canceled",
                          "self_trade_prevention_type": "taker_at_cross"}, body

          # topic discovery vocabulary, all re-checked against the live demo API on 2026-11-20
          assert TOPIC_FILTERS["culture"]["category"] == "Culture", TOPIC_FILTERS["culture"]
          assert TOPIC_FILTERS["culture"]["extra_categories"] == ["Entertainment"]
          assert TOPIC_FILTERS["gas"]["category"] == "Economics", "there is no Gas category"
          assert TOPIC_FILTERS["golf"]["category"] == "Sports", "there is no Golf category"
          print("offline python checks passed")
          PY

      # Continuous, non-blocking: a drift here is a review item, not a publish blocker.
      - name: Re-verify published rows against the live demo API
        continue-on-error: true
        run: python scripts/verify_series.py | tee verify-rows.txt

      - name: Snapshot capture contract (dry run, nothing written)
        continue-on-error: true
        run: node scripts/capture-snapshot.js --dry-run

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the docs/ tree to gh-pages when the published site is stale
      pages: write      # POST /pages/builds (explicit legacy Pages build trigger)
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the freshness check must read the published commit's tree, and
          # the publish step builds a commit on top of the gh-pages tip (a shallow clone
          # breaks that with git exit 128).
          fetch-depth: 0

      # HOW THIS REPO PUBLISHES (verified 2026-11-21 against the live API; integrator
      # update, session arena/ccf26d52-trade3 — supersedes the verify-only design from
      # session arena/651b296e-trade3. Their staleness gate is kept below as the gate;
      # this revision adds the publish path so the live site tracks verified main with
      # zero manual steps, which the project brief demands.)
      #
      # GitHub Pages on this repository is bound to the `gh-pages` branch:
      #   GET /repos/{owner}/{repo}/pages
      #   -> { status: "built", build_type: "legacy",
      #        source: { branch: "gh-pages", path: "/" }, https_enforced: true,
      #        html_url: "https://wingbangboozle1-lang.github.io/Trade3/" }
      #
      # The artifact route (actions/configure-pages + actions/deploy-pages) is not
      # available: this installation's tokens have no Pages-admin permission, so
      # POST /repos/{owner}/{repo}/pages returns 403 "Resource not accessible by
      # integration" (flag F8; full evidence on docs/flagged.html).
      #
      # Publishing therefore works like this, fully automatically:
      #   1. If gh-pages already serves exactly docs/ at this commit, do nothing.
      #   2. Otherwise push the docs/ tree to gh-pages (needs only `contents: write`).
      #      Per GitHub's docs ("Configuring a publishing source for your GitHub Pages
      #      site"), commits pushed by a workflow with the GITHUB_TOKEN do NOT trigger
      #      a legacy Pages build.
      #   3. So the push is followed by an explicit build request —
      #      POST /repos/{owner}/{repo}/pages/builds ("Request a GitHub Pages build",
      #      https://docs.github.com/rest/pages/pages#request-a-github-pages-build) —
      #      which the workflow token can make (pages: write). If that call is ever
      #      refused, the job fails loudly with the exact manual fallback; it never
      #      leaves a stale site looking green.
      #   4. The final gate re-checks the built tree and fails unless the published
      #      site is current.

      - name: Check freshness of the published site
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD:docs)
          echo "docs/ tree at $GITHUB_SHA: $expected"

          # Read the published tree straight from the Pages build record.
          json=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || echo '{}')
          status=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo '')
          commit=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo '')
          echo "latest Pages build: status=${status:-unknown} commit=${commit:-unknown}"

          published=""
          if [ -n "$commit" ]; then
            # On gh-pages the tree root IS docs/, so the published commit's tree
            # must equal this commit's docs/ tree.
            published=$(git rev-parse "${commit}:docs" 2>/dev/null || git rev-parse "${commit}^{tree}" 2>/dev/null || echo '')
          fi

          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [ "$status" = "built" ] && [ "$published" = "$expected" ]; then
            echo "::notice title=Published site is current::gh-pages serves docs/ from $GITHUB_SHA exactly."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Published site is stale::Pages serves ${commit:0:12} (${status:-unknown}) but docs/ at ${GITHUB_SHA:0:12} is expected. Publishing."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish docs/ to gh-pages and trigger a Pages build
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          expected="${{ steps.check.outputs.expected }}"
          # Runners configure no git identity; commit-tree fails with exit 128
          # ("unable to auto-detect email address") without one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          parent_args=()
          if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then parent_args=(-p FETCH_HEAD); fi
          new=$(git commit-tree "$expected" "${parent_args[@]}" -m "Publish docs/ from ${GITHUB_SHA}")
          echo "created ${new} (tree ${expected})"
          if ! git push origin "+${new}:refs/heads/gh-pages"; then
            echo "::error title=gh-pages push failed::the workflow token could not push to gh-pages (git exit 128 usually means the remote refused the push: 403 write access not granted, or a ruleset/protection on gh-pages). Check Settings -> Actions -> General -> Workflow permissions (must allow read and write) and any branch rulesets on gh-pages. The verify job above passed; the site artifact is ready."
            exit 1
          fi
          echo "pushed ${new} to gh-pages"

          # A GITHUB_TOKEN push does not trigger a legacy Pages build (GitHub docs);
          # request one explicitly.
          code=$(curl -s -o /tmp/build.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || echo 000)
          echo "POST /pages/builds -> $code"
          if [ "$code" != "201" ]; then
            cat /tmp/build.json || true
            echo "::error title=Pages build could not be triggered::the tree was pushed to gh-pages (${new}) but POST /pages/builds returned ${code}. One manual step remains (it triggers the legacy build because it is not a GITHUB_TOKEN push): git fetch origin gh-pages && git commit-tree \$(git rev-parse HEAD:docs) -p FETCH_HEAD -m 'Publish docs/' | xargs git push origin +:refs/heads/gh-pages"
            exit 1
          fi

          # Wait for the build and prove it serves the pushed tree (never silent).
          for i in $(seq 1 24); do
            sleep 5
            json=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || echo '{}')
            status=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo '')
            commit=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo '')
            echo "build poll ${i}: status=${status:-unknown} commit=${commit:-unknown}"
            if [ "$status" = "built" ] && [ "$commit" = "$new" ]; then
              echo "::notice title=Pages build complete::gh-pages@${new:0:12} is built and serving."
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "::error title=Pages build errored::see the repository's Pages build logs."
              exit 1
            fi
          done
          echo "::warning title=Pages build still running::polling timed out; the final gate below decides."

      - name: Published site must be current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD:docs)
          json=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || echo '{}')
          status=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo '')
          commit=$(printf '%s' "$json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo '')
          published=""
          if [ -n "$commit" ]; then
            published=$(git rev-parse "${commit}:docs" 2>/dev/null || git rev-parse "${commit}^{tree}" 2>/dev/null || echo '')
          fi
          if [ "$status" = "built" ] && [ "$published" = "$expected" ]; then
            echo "::notice title=Published site is current::gh-pages serves docs/ from $GITHUB_SHA exactly."
            exit 0
          fi
          echo "::error title=Published site is stale::Pages is serving commit ${commit:0:12} (${status:-unknown}), which is not docs/ at ${GITHUB_SHA:0:12}. Manual fallback (a non-GITHUB_TOKEN push triggers the legacy build): git fetch origin gh-pages && git commit-tree \$(git rev-parse HEAD:docs) -p FETCH_HEAD -m 'Publish docs/' | xargs git push origin +:refs/heads/gh-pages"
          exit 1
