name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Site checks (links, JS syntax, data integrity)
        run: python scripts/check_site.py

      - name: Dashboard logic unit tests
        run: node tests/logic.test.mjs

      - name: Render tests (real page scripts against recorded API shapes)
        run: |
          npm install --no-save --no-fund --silent jsdom@25
          node tests/render.test.mjs

      - name: Python deps
        run: pip install requests cryptography

      - name: Python syntax + offline unit checks
        run: |
          python -m py_compile kalshi_client.py strategies.py backtest.py run_sim.py
          python - <<'PY'
          from strategies import momentum, mean_reversion, is_high_roi, drift
          from backtest import PaperPortfolio, entry_price
          from kalshi_client import KalshiClient, normalise_tag, classify

          m = {"ticker": "T", "last_price_dollars": "0.5500", "previous_price_dollars": "0.4000",
               "yes_bid_dollars": "0.5400", "yes_ask_dollars": "0.5600", "volume_fp": "1000.00"}
          assert abs(drift(m) - 0.15) < 1e-9
          assert momentum(m) == "yes"
          ok, reasons = is_high_roi(m, 0.15)
          assert ok, reasons
          assert abs(entry_price(m, "yes") - 0.56) < 1e-9
          assert abs(entry_price(m, "no") - 0.46) < 1e-9

          pf = PaperPortfolio()
          t = pf.open(m, "momentum", "yes", 10, 1)
          pf.mark({"ticker": "T", "last_price_dollars": "0.7000"})
          assert abs(t.unrealised - 1.4) < 1e-9
          pf.settle({"ticker": "T", "result": "yes"})
          assert abs(pf.summary()["realised_pnl"] - 4.4) < 1e-9

          assert normalise_tag("Oil & Gas") == "oil and gas"
          ev = [{"event_ticker": "E", "category": "Crypto", "series_ticker": "KXETHD"}]
          mk = [{"ticker": "M", "event_ticker": "E"}]
          assert classify(mk, ev, {"crypto": {"KXETHD"}})[0]["_topic"] == "crypto"
          assert classify(mk, ev, {"crypto": set()}) == []

          body = KalshiClient().place_order("TICK", "bid", 0.42, 1, dry_run=True)["request"]
          assert body["price"] == "0.4200" and body["count"] == "1" and body["side"] == "bid"

          print("offline checks passed")
          PY

      - name: Verify series rows against the live Kalshi demo API
        continue-on-error: true
        run: python scripts/verify_series.py --json verify_report.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify_report.json
          if-no-files-found: ignore
